---
layout: default
---
<section class="intro">
  <h1>Hi, I'm {{ site.author }}.</h1>
  <p>{{ site.description }} <a href="{{ '/about/' | relative_url }}">More about me →</a></p>
</section>

<section class="posts">
  <h2>Writing on development</h2>
  {% if site.posts.size == 0 %}<p class="empty">First posts coming soon.</p>{% endif %}
  <ul>
    {% for post in site.posts %}
    <li>
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %-d, %Y" }}</time>
    </li>
    {% endfor %}
  </ul>
</section>
